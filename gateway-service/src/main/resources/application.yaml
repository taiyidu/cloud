server:
  port: 8080        # 复用原来的 8080，前端无需改动

spring:
  application:
    name: gateway
  cloud:
    nacos:
      server-addr: localhost:8848
    gateway:
      routes:
        - id: item-service       #  唯一标识
          uri: lb://item-service #  路由目标微服务  lb代表负载均衡 load balance
          predicates:            #  路由断言，判断请求是否符合规则，符合则路由到目标
            - Path=/items/**     #  以请求路径做判断，以/items开头则符合
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/carts/**
        - id: trade-service
          uri: lb://trade-service
          predicates:
            - Path=/orders/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: pay-service
          uri: lb://pay-service
          predicates:
            - Path=/pay-orders/**
        - id: item-service-search
          uri: lb://item-service
          predicates:
            - Path=/search/**
#      default-filters:
#        - PrintAny=1,2,3
hm:
  jwt:
    location: classpath:hmall.jks
    alias: hmall
    password: hmall123
